"$schema" = 'https://starship.rs/config-schema.json'
add_newline = true
format = """$directory$git_branch$git_status$nodejs$python$ruby$rust$golang$cmd_duration$line_break$character"""

[directory]
style = 'bold cyan'
format = '[  $path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = true
read_only = ' '

[git_branch]
symbol = ' '
style = 'bold purple'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = 'bold yellow'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↕↑${ahead_count}↓${behind_count} '
untracked = '?${count} '
stashed = '*${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = 'x${count} '

[nodejs]
symbol = ' '
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
format = '[${symbol}(${version} )(\($virtualenv\) )]($style)'

[ruby]
symbol = ' '
format = '[$symbol($version )]($style)'

[rust]
symbol = ' '
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
format = '[$symbol($version )]($style)'

[cmd_duration]
min_time = 2000
format = '[ $duration](dimmed yellow) '

[character]
success_symbol = '[❯](bold purple)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
